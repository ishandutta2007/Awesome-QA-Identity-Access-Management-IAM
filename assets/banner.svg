<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Accent Gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <!-- Subtle Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.75" stroke-opacity="0.6"/>
    </pattern>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    .title {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 42px;
      fill: #ffffff;
      letter-spacing: -0.5px;
    }
    .subtitle {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 400;
      font-size: 17px;
      fill: #94a3b8;
      letter-spacing: 0.2px;
    }
    .badge-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 13px;
      fill: #e2e8f0;
    }
    /* Dynamic floating particles & waves in background */
    @keyframes floatParticle {
      0% { transform: translateY(0px) translateX(0px); opacity: 0.3; }
      50% { transform: translateY(-25px) translateX(15px); opacity: 0.8; }
      100% { transform: translateY(0px) translateX(0px); opacity: 0.3; }
    }
    @keyframes pulseGlow {
      0% { r: 120px; opacity: 0.15; }
      50% { r: 160px; opacity: 0.30; }
      100% { r: 120px; opacity: 0.15; }
    }
    @keyframes flowLine {
      0% { stroke-dashoffset: 400; }
      100% { stroke-dashoffset: 0; }
    }
    .floating-orb1 {
      animation: pulseGlow 6s ease-in-out infinite;
    }
    .floating-orb2 {
      animation: pulseGlow 8s ease-in-out infinite reverse;
    }
    .particle-1 { animation: floatParticle 7s ease-in-out infinite; }
    .particle-2 { animation: floatParticle 9s ease-in-out infinite 2s; }
    .particle-3 { animation: floatParticle 6s ease-in-out infinite 1s; }
    .flow-line {
      stroke-dasharray: 20 10;
      animation: flowLine 20s linear infinite;
    }
  </style>

  <!-- Deep Canvas Background -->
  <rect width="1200" height="360" fill="url(#bgGrad)" />
  <rect width="1200" height="360" fill="url(#grid)" />

  <!-- Dynamic / Animated Background Orbs (Strictly kept in the background) -->
  <g opacity="0.7">
    <circle class="floating-orb1" cx="220" cy="180" r="140" fill="#38bdf8" filter="url(#glow)" />
    <circle class="floating-orb2" cx="980" cy="180" r="150" fill="#a855f7" filter="url(#glow)" />
    <circle cx="600" cy="70" r="90" fill="#6366f1" opacity="0.12" filter="url(#glow)" />
  </g>

  <!-- Background Animated Network / Flow Lines -->
  <g stroke="#38bdf8" stroke-opacity="0.25" stroke-width="1.5" fill="none">
    <path class="flow-line" d="M 50 80 Q 300 20 600 80 T 1150 80" />
    <path class="flow-line" d="M 50 280 Q 400 340 700 280 T 1150 280" />
    <path d="M 180 50 L 260 120 M 920 240 L 1000 310 M 1020 90 L 960 150" stroke="#818cf8" stroke-opacity="0.2" />
  </g>

  <!-- Dynamic Particles (in background layer) -->
  <g fill="#38bdf8">
    <circle class="particle-1" cx="150" cy="120" r="3" />
    <circle class="particle-2" cx="280" cy="240" r="2.5" />
    <circle class="particle-3" cx="920" cy="100" r="3.5" fill="#c084fc" />
    <circle class="particle-1" cx="1050" cy="220" r="2" fill="#818cf8" />
  </g>

  <!-- Key & Shield Security Icon Graphic (Centered above title) -->
  <g transform="translate(600, 72) scale(0.9)" filter="url(#subtleGlow)">
    <g transform="translate(-32, -32)">
      <!-- Shield Shape -->
      <path d="M 32 4 C 48 4 60 12 60 26 C 60 46 32 58 32 58 C 32 58 4 46 4 26 C 4 12 16 4 32 4 Z" 
            fill="#0f172a" stroke="url(#accentGrad)" stroke-width="2.5" />
      <!-- Keyhole / Auth Icon -->
      <circle cx="32" cy="24" r="5.5" fill="none" stroke="#38bdf8" stroke-width="2.5" />
      <path d="M 30 28 L 34 28 L 35 40 L 29 40 Z" fill="#38bdf8" />
    </g>
  </g>

  <!-- FOREGROUND: Main Title & Subtitle (Clear, readable, high contrast) -->
  <text class="title" x="600" y="165" text-anchor="middle">
    Awesome QA Identity &amp; Access Management (IAM)
  </text>
  
  <text class="subtitle" x="600" y="205" text-anchor="middle">
    Curated SaaS &amp; Open-Source Identity Providers, SSO, SCIM Provisioning &amp; Granular RBAC
  </text>

  <!-- Feature Pills / Badges in Foreground -->
  <g transform="translate(600, 248)">
    <!-- Pill 1: SSO -->
    <g transform="translate(-310, 0)">
      <rect x="0" y="0" width="135" height="32" rx="16" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2" opacity="0.9" />
      <text class="badge-text" x="67" y="21" text-anchor="middle">🔐 SSO &amp; SAML</text>
    </g>
    <!-- Pill 2: SCIM 2.0 -->
    <g transform="translate(-160, 0)">
      <rect x="0" y="0" width="145" height="32" rx="16" fill="#1e293b" stroke="#818cf8" stroke-width="1.2" opacity="0.9" />
      <text class="badge-text" x="72" y="21" text-anchor="middle">🔄 SCIM Provisioning</text>
    </g>
    <!-- Pill 3: RBAC & ABAC -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="145" height="32" rx="16" fill="#1e293b" stroke="#a855f7" stroke-width="1.2" opacity="0.9" />
      <text class="badge-text" x="72" y="21" text-anchor="middle">🛡️ RBAC / ABAC</text>
    </g>
    <!-- Pill 4: Open Source & SaaS -->
    <g transform="translate(160, 0)">
      <rect x="0" y="0" width="150" height="32" rx="16" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2" opacity="0.9" />
      <text class="badge-text" x="75" y="21" text-anchor="middle">⚡ Open-Source &amp; Cloud</text>
    </g>
  </g>

  <!-- Bottom Accent Bar -->
  <rect x="450" y="315" width="300" height="3" rx="1.5" fill="url(#accentGrad)" />
</svg>
